name: Tests
on:
  pull_request:
    paths:
      - .github/workflows/tests.yml
      - androidApp/**
      - desktopApp/**
      - shared/**
      - native/**
      - gradle/**
      - '*.gradle.kts'
      - gradle.properties
      - gradlew
      - gradlew.bat
      - scripts/**
      - '!scripts/package-website.py'
      - packaging/**
      - '!packaging/screenshots/**'
      - '!packaging/fdroid-qr*.png'
      - .fdroid.yml
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  desktop:
    runs-on: ubuntu-24.04
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.test-environment/mpv-runtime/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv libmpv-dev libsecret-tools gnome-keyring openssh-server xvfb xauth dbus cmake ninja-build libsdl2-dev libgl1-mesa-dev pulseaudio pulseaudio-utils meson pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libplacebo-dev libass-dev libpulse-dev libasound2-dev
      - run: python3 scripts/build_mpv.py --prefix .test-environment/mpv-runtime
      - run: dbus-run-session -- bash scripts/ci-tests.sh desktop
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-results
          path: |
            shared/build/test-results/desktopTest
            shared/hs_err_pid*.log
  android:
    name: android (${{ matrix.device.api }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device:
          - api: 31
            target: google_apis
          - api: 36
            target: google_apis_ps16k
        # Each shard runs a quarter of the instrumentation classes on its own emulator.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv libsecret-tools openssh-server cmake ninja-build libsdl2-dev libgl1-mesa-dev pulseaudio-utils
      - name: Build test artifacts before starting the emulator
        run: >-
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :shared:desktopTestClasses
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.device.api }}
          target: ${{ matrix.device.target }}
          arch: x86_64
          disable-linux-hw-accel: false
          profile: pixel_2
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: MANIDA_ANDROID_SHARD=${{ matrix.shard }}/4 bash scripts/ci-tests.sh android
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.device.api }}-shard-${{ matrix.shard }}-test-results
          path: |
            .test-environment/android-class-results
            .test-environment/pairing.log
            .test-environment/sftp.log
